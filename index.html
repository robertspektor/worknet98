<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReCompany</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Pixelify+Sans:wght@400;600&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/room.css">
  <link rel="stylesheet" href="css/boot.css">
  <link rel="stylesheet" href="css/os.css">
  <link rel="stylesheet" href="css/apps.css">
</head>
<body>
  <main class="room">
    <div class="monitor">
      <div class="sticky-note">
        1. Press power<br>
        2. Found a company<br>
        3. Get rich
      </div>
      <div class="monitor-case">
        <div class="screen-frame">
          <div class="screen" data-screen>
            <div class="screen-content">
              <div class="viewport" data-viewport></div>
            </div>
          </div>
        </div>
        <div class="monitor-chin">
          <span class="brand">RETROTRON 1995</span>
          <div class="vents" aria-hidden="true"><span></span><span></span><span></span></div>
          <div class="power">
            <span class="power-led" data-power-led></span>
            <button class="power-button is-hinting" data-power-button aria-label="Power">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="stand"></div>
    </div>
    <div class="desk"></div>
  </main>
  <script type="module" src="js/main.js"></script>
  <script src="js/bootWatchdog.js"></script>
</body>
</html>
